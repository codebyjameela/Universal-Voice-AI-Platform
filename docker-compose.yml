version: '3.8'

services:
  # Vector Database for Domain RAG Knowledge Embeddings
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: voice-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: voice_ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - '5432:5432'
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d voice_ai_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
